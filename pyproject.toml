[project]
name = "xiaoqian"
version = "0.1.0"
description = "小倩 · 主动式兴趣聊天助手"
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # 数据库
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",

    # 向量数据库
    "chromadb>=0.6.0",

    # Redis
    "redis>=5.2.0",
    "aioredis>=2.0.1",

    # AI / LLM
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "openai>=1.55.0",

    # 搜索
    "tavily-python>=0.5.0",

    # 任务调度
    "apscheduler>=3.10.4",

    # 安全认证
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # 工具
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "loguru>=0.7.2",

    # 短信（阿里云）
    "alibabacloud-dysmsapi20170525>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
